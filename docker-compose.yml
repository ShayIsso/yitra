# Pinned so the Compose project (and its container names) never depend on the
# checkout directory's name.
name: yitra

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yitra
      POSTGRES_USER: yitra
      POSTGRES_PASSWORD: yitra_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: yitra
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://yitra:yitra_dev@db:5432/yitra
      - CHROMIUM_PATH=/usr/bin/chromium
    env_file:
      - .env
    profiles:
      - production

volumes:
  pgdata:
    # Pinned: the data lives in this volume, and a derived name would change
    # with the project name, starting the app on a silently empty database.
    # Installs from before the rename keep their data in `shayfinance_pgdata`
    # (README, "Upgrading from the ShayFinance name").
    name: yitra_pgdata
